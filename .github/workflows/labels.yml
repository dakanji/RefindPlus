name: 'Auto Labels'

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: write

jobs:

  # Auto Labels - https://github.com/dessant/label-actions
  auto_labels:
    name: Handle Labels
    runs-on: ubuntu-latest

    if: github.actor == 'dakanji'
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: dessant/label-actions@v5
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          config-path: '.github/label-config.yml'
          process-only: ''

  # Check Labels - https://github.com/mheap/github-action-required-labels
  handle_enhance_check:
    name: Handle Enhance - Check
    needs: [auto_labels]
    runs-on: ubuntu-latest

    if: |
      github.actor == 'dakanji' && (
        github.event.label.name == 'Invalid' ||
        github.event.label.name == 'Not-Planned'
      )
    outputs:
      status: ${{ steps.handle_enhance_check_main.outputs.status }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: handle_enhance_check_main
        uses: mheap/github-action-required-labels@v5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          mode: exactly
          count: 1
          labels: "Enhancement"
          exit_type: success

  # Close Issue
  handle_enhance_act:
    name: Handle Enhance - Act
    needs: [handle_enhance_check]
    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dakanji' && needs.handle_enhance_check.outputs.status == 'success' }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Tag Item
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Tagged'

      - name: Close Item
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER"

  # Check Labels - https://github.com/mheap/github-action-required-labels
  handle_resolved_check_1:
    name: Handle Resolved - Check1
    needs: [auto_labels]
    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dakanji' && github.event.label.name == 'Resolved' }}
    outputs:
      status: ${{ steps.handle_resolved_check_1_main.outputs.status }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: handle_resolved_check_1_main
        uses: mheap/github-action-required-labels@v5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          mode: minimum
          count: 1
          labels: "Confirmed, Known-Issue"
          exit_type: success

  # Check Labels - https://github.com/mheap/github-action-required-labels
  handle_resolved_check_2:
    name: Handle Resolved - Check2
    needs: [handle_resolved_check_1]
    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dakanji' && needs.handle_resolved_check_1.outputs.status == 'success' }}
    outputs:
      status: ${{ steps.handle_resolved_check_2_main.outputs.status }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: handle_resolved_check_2_main
        uses: mheap/github-action-required-labels@v5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          mode: maximum
          count: 0
          labels: "Upstream"
          exit_type: success

  # Update Labels
  handle_resolved_act:
    name: Handle Resolved - Act
    needs: [handle_resolved_check_2]
    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dakanji' && needs.handle_resolved_check_2.outputs.status == 'success' }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Remove Label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Confirmed,Known-Issue'

      - name: Add Label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Bug'

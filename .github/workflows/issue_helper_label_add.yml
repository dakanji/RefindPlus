name: 'Issue Helper Label Add'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Issue Action'
        type: choice
        options:
        - 'Label - Add - Abandoned'
        - 'Label - Add - Bug'
        - 'Label - Add - Cancelled'
        - 'Label - Add - Config'
        - 'Label - Add - Cannot-Replicate'
        - 'Label - Add - Discussion'
        - 'Label - Add - Dropped'
        - 'Label - Add - Enhancement - Only'
        - 'Label - Add - Incomplete - Issues'
        - 'Label - Add - Incomplete - Enhancement'
        - 'Label - Add - Invalid'
        - 'Label - Add - Noted'
        - 'Label - Add - Not-Planned_and_Enhancement'
        - 'Label - Add - Not-Planned - Only'
        - 'Label - Add - Parked'
        - 'Label - Add - Prorogued'
        - 'Label - Add - Queries'
        - 'Label - Add - Resolved'
        - 'Label - Add - Stale'
        - 'Label - Add - Tagged'
        - 'Label - Add - Triage'
        - 'Label - Add - Unresolved'
        - 'Label - Add - Upstream'
        default: 'Label - Add - Invalid'
      item_id:
        description: 'Item ID'
        type: string
        required: true
      discussion_reason:
        description: 'Reason for Discussion Label'
        type: choice
        options:
        - 'Question/Comment-Only'
        - 'Other'
      comment_data:
        description: 'Optional Extra Comment'
        type: string

permissions:
  issues: write

concurrency:
  group: lock

jobs:

  # ── Label: Abandoned ──────────────────────────────────────────────
  label_add_abandoned:
    name: Label - Add - Abandoned
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Abandoned'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Add Abandoned label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Abandoned'

  # ── Label: Bug ────────────────────────────────────────────────────
  label_add_bug:
    name: Label - Add - Bug
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Bug'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          cat <<'EOF' > comment-body.md
          Thank you for taking the time to report a problem with RefindPlus.
          The problem has been confirmed and will be addressed presently.

          EOF
          printf '%s\n' "$COMMENT_DATA" >> comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Add Bug label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Bug'

      - name: Remove other labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Not-Planned,Uncertain,Confirmed,Cancelled,Accepted,Resolved,Triage,No-Log,Parked,Tagged,Stale,Config,Queries,Unclear,Invalid,Prorogued,Incomplete,Known-Issue,Cannot-Replicate'

  # ── Label: Cancelled ──────────────────────────────────────────────
  label_add_cancelled:
    name: Label - Add - Cancelled
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Cancelled'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Cancelled label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Cancelled'

      - name: Remove Triage and No-Log labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log'

      - name: Close issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

  # ── Label: Discussion ────────────────────────────────────────────
  label_add_discussion:
    name: Label - Add - Discussion
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Discussion'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch issue details
        id: get-issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          issue=$(gh issue view "$ISSUE_NUMBER" --json title,body)
          title=$(echo "$issue" | jq -r '.title')
          body=$(echo "$issue" | jq -r '.body')
          notice="# This Discussion Item is an Automated Conversion of Issue/Enhancement Item #${ISSUE_NUMBER}"$'\n\n'"${body}"

          # Safe Multiline Write
          echo "ISSUE_TITLE<<EOF" >> "$GITHUB_ENV"
          echo "$title" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "NOTICE_BODY<<EOF" >> "$GITHUB_ENV"
          echo "$notice" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # category_id is hard-coded (same as before)
      - name: Create discussion
        id: create-discussion
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ env.ISSUE_TITLE }}
          BODY: ${{ env.NOTICE_BODY }}
        run: |
          response=$(gh api "repos/$GH_REPO/discussions" \
            --method POST \
            --field title="$TITLE" \
            --field body="$BODY" \
            --field category_id="MDE4OkRpc2N1c3Npb25DYXRlZ29yeTMyMDE4Mjgy")
          discussion_url=$(echo "$response" | jq -r '.html_url')
          echo "DISCUSSION_URL=$discussion_url" >> "$GITHUB_ENV"

      - name: Comment on original issue (Question/Comment-Only)
        if: github.event.inputs.discussion_reason == 'Question/Comment-Only'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCUSSION_URL: ${{ env.DISCUSSION_URL }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          {
            echo "This item has been converted to [THIS DISCUSSION ITEM](${DISCUSSION_URL})."
            echo ""
            echo "> [!IMPORTANT]"
            echo "> You have just asked a question or simply made a comment."
            echo "> The template indicates these should be under Discussions."
            echo "> The guidance in the template appears to have been ignored."
            echo ""
            echo "Please use the Discussions Feature for similar items in future."
            echo ""
            printf '%s\n' "$COMMENT_DATA"
            echo ""
            echo "Thank you."
          } > comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Comment on original issue (Other)
        if: github.event.inputs.discussion_reason == 'Other'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCUSSION_URL: ${{ env.DISCUSSION_URL }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          {
            echo "This item has been converted to [THIS DISCUSSION ITEM](${DISCUSSION_URL})."
            echo ""
            printf '%s\n' "$COMMENT_DATA"
          } > comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Remove various labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Not-Planned,Parked,Stale,Queries,Invalid,Prorogued,Duplicate,Incomplete,Known-Issue,Enhancement,Cannot-Replicate'

      - name: Add Discussion label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Discussion'

      - name: Close original issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

      - name: Lock original issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

  # ── Label: Dropped ────────────────────────────────────────────────
  label_add_dropped:
    name: Label - Add - Dropped
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Dropped'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Dropped label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Dropped'

      - name: Remove most labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Enhancement,Not-Planned,Unresolved,Uncertain,Confirmed,Cancelled,Accepted,Resolved,Triage,No-Log,Parked,Tagged,Stale,Bug,Config,Queries,Unclear,Invalid,Prorogued,Incomplete,Known-Issue,Cannot-Replicate'

      - name: Close issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

      - name: Lock issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

  # ── Label: Noted ──────────────────────────────────────────────────
  label_add_noted:
    name: Label - Add - Noted
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Noted'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          cat <<'EOF' > comment-body.md
          Thank you for taking the time to report a problem with RefindPlus.
          The problem is noted and will be considered as required.

          EOF
          printf '%s\n' "$COMMENT_DATA" >> comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Add Noted label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Noted'

      - name: Remove Triage, No-Log, Queries, Confirmed labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Queries,Confirmed'

      - name: Close issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

  # ── Label: Config ─────────────────────────────────────────────────
  label_add_config:
    name: Label - Add - Config
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Config'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          cat <<'EOF' > comment-body.md
          Thank you for taking the time to report a problem with RefindPlus.
          The problem has been assessed as being configuration/setup related.

          Please consult available documentation and amend your setup as required.
          Documentation is provided in the `ReadMe` on the front page of this repository
          as well as in the sample `config.conf` file. Additionally, extensive documentation
          provided upstream can be consulted as this is largely also applicable to RefindPlus.

          EOF
          printf '%s\n' "$COMMENT_DATA" >> comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Add Config label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Config'

      - name: Remove Triage, No-Log, Queries, Confirmed labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Queries,Confirmed'

      - name: Close issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

  # ── Label: Cannot-Replicate ───────────────────────────────────────
  label_add_cannot-replicate:
    name: Label - Add - Cannot-Replicate
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Cannot-Replicate'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Cannot-Replicate label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Cannot-Replicate'

      - name: Remove Triage, No-Log, Queries, Confirmed labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Queries,Confirmed'

      - name: Close issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

  # ── Label: Incomplete (Issues) ────────────────────────────────────
  label_add_incomplete_issue:
    name: Label - Add - Incomplete - Issues
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Incomplete - Issues'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          cat <<'EOF' > comment-body.md
          Thank you for taking the time to report a problem with RefindPlus.

          However, at least one required item is missing.
          This is typically debug log(s) or suggested initial tests.

          On debug logs, note that...
          - They are invariably required.
          - They are always produced when running the 'DBG' file.

          EOF
          printf '%s\n' "$COMMENT_DATA" >> comment-body.md
          cat <<'EOF' >> comment-body.md

          Please rectify the oversight.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Add Incomplete label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Incomplete'

      - name: Remove Triage, No-Log labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log'

  # ── Label: Incomplete (Enhancement) ───────────────────────────────
  label_add_incomplete_enhancement:
    name: Label - Add - Incomplete - Enhancement
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'Label - Add - Incomplete - Enhancement'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_DATA: ${{ github.event.inputs.comment_data }}
        run: |
          cat <<'EOF' > comment-body.md
          Thank you for taking the time to suggest improvements to RefindPlus.

          However, at least one required item is missing.
          This is typically useful background information.

          EOF
          printf '%s\n' "$COMMENT_DATA" >> comment-body.md
          cat <<'EOF' >> comment-body.md

          Please amend your post accordingly.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - name: Add Incomplete label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Incomplete'

      - name: Remove Triage, No-Log labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log'

  # ── Label: Invalid ────────────────────────────────────────────────
  label_add_invalid:
    name: Label - Add - Invalid
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Invalid'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Invalid label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Invalid'

  # ── Label: Triage ─────────────────────────────────────────────────
  label_add_pending:
    name: Label - Add - Triage
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Triage'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Triage label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Triage'

  # ── Label: Parked ─────────────────────────────────────────────────
  label_add_parked:
    name: Label - Add - Parked
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'Label - Add - Parked'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Parked label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Parked'

  # ── Label: Prorogued ──────────────────────────────────────────────
  label_add_prorogued:
    name: Label - Add - Prorogued
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'Label - Add - Prorogued'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Prorogued label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Prorogued'

  # ── Label: Resolved ───────────────────────────────────────────────
  label_add_resolved:
    name: Label - Add - Resolved
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Resolved'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Resolved label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Resolved'

      - name: Remove Unresolved label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Unresolved'

  # ── Label: Unresolved ─────────────────────────────────────────────
  label_add_unresolved:
    name: Label - Add - Unresolved
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Unresolved'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Unresolved label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Unresolved'

      - name: Remove Resolved label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Resolved'

  # ── Label: Stale ──────────────────────────────────────────────────
  label_add_stale:
    name: Label - Add - Stale
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Stale'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Stale label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Stale'

  # ── Label: Tagged ─────────────────────────────────────────────────
  label_add_tagged:
    name: Label - Add - Tagged
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Tagged'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Tagged label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Tagged'

  # ── Label: Queries ────────────────────────────────────────────────
  label_add_queries:
    name: Label - Add - Queries
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Queries'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Queries label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Queries'

  # ── Label: Upstream ───────────────────────────────────────────────
  label_add_upstream:
    name: Label - Add - Upstream
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Upstream'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Upstream label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Upstream'

  # ── Label: Enhancement only ───────────────────────────────────────
  label_add_enhancement:
    name: Label - Add - Enhancement - Only
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Enhancement - Only'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Enhancement label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Enhancement'

      - name: Remove Triage, No-Log, Queries labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Queries'

  # ── Label: Not-Planned + Enhancement ─────────────────────────────
  label_add_not-planned_enhancement:
    name: Label - Add - Not-Planned_and_Enhancement
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Not-Planned_and_Enhancement'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Enhancement and Not-Planned labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Enhancement,Not-Planned'

      - name: Remove Triage, No-Log, Queries labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Queries'

      - name: Close issue (not planned)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "not planned"

  # ── Label: Not-Planned only ──────────────────────────────────────
  label_add_not-planned:
    name: Label - Add - Not-Planned - Only
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Add - Not-Planned - Only'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add Not-Planned label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Not-Planned'

      - name: Close issue (not planned)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "not planned"

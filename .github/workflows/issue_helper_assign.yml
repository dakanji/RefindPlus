name: 'Issue Helper Assign'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Issue Action'
        type: choice
        options:
        - 'Assignment - Self - Add'
        - 'Assignment - Self - Remove'
        default: 'Assignment - Self - Add'
      item_id:
        description: 'Item ID'
        type: string
        required: true

permissions:
  issues: write

concurrency:
  group: lock

jobs:

  # Misc Issue Items
  add_assignees:
    name: Assignment - Self - Add
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Assignment - Self - Add'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-assignee "${{ github.actor }}"

  remove_assignees:
    name: Assignment - Self - Remove
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Assignment - Self - Remove'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-assignee "${{ github.actor }}"

name: 'Issue Helper Access'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Issue Action'
        type: choice
        options:
        - 'Issue - Open'
        - 'Issue - Close'
        - 'Issue - Thread - Lock'
        - 'Issue - Thread - Unlock'
        - 'Issue - Comment - Delete'
        - 'Issue - Comment - Add'
        - 'Issue - OpenUnlock'
        - 'Issue - CloseLock'
        default: 'Issue - Open'
      item_id:
        description: 'Item ID'
        type: string
        required: true
      comment_data:
        description: 'Input for Comment - Add'
        type: string

permissions:
  issues: write

concurrency:
  group: lock

jobs:

  # Misc Issue Items
  issue_open_unlock1:
    name: Issue - OpenUnlock1
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - OpenUnlock'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Invalid,Resolved,Duplicate,Not-Planned,Incomplete,Known-Issue'

  issue_open_unlock2:
    name: Issue - OpenUnlock2
    needs: [issue_open_unlock1]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue unlock "$ISSUE_NUMBER"

  issue_open_unlock3:
    name: Issue - OpenUnlock3
    needs: [issue_open_unlock2]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue reopen "$ISSUE_NUMBER"

  # Misc Issue Items
  issue_close_lock1:
    name: Issue - CloseLock1
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - CloseLock'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Queries,Triage,No-Log,Tagged,Stale'

  issue_close_lock2:
    name: Issue - CloseLock2
    needs: [issue_close_lock1]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

  issue_close_lock3:
    name: Issue - CloseLock3
    needs: [issue_close_lock2]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cat <<'EOF' > comment-body.md
          This thread is being locked.

          Please use the [Discussions Feature](https://github.com/RefindPlusRepo/RefindPlus/discussions?discussions_q=sort%3Adate_created) for follow-on discussion or raise a new issue if appropriate.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

  issue_close_lock4:
    name: Issue - CloseLock4
    needs: [issue_close_lock3]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

  # Misc Issue Items
  issue_open:
    name: Issue - Open
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - Open'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue reopen "$ISSUE_NUMBER"

  issue_close1:
    name: Issue - Close1
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - Close'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Tagged'

  issue_close2:
    name: Issue - Close2
    needs: [issue_close1]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

  issue_comment_delete:
    name: Issue - Comment - Delete
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - Comment - Delete'
    env:
      GH_REPO: ${{ github.repository }}
      COMMENT_ID: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # gh has no built-in "delete comment" subcommand, so this goes via the API directly.
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"

  issue_comment_add:
    name: Issue - Comment - Add
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - Comment - Add'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.inputs.comment_data }}
        run: |
          printf '%s\n' "$COMMENT_BODY" > comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

  issue_thread_lock1:
    name: Issue - Thread - Lock1
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - Thread - Lock'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Tagged,Stale'

  issue_thread_lock2:
    name: Issue - Thread - Lock2
    needs: [issue_thread_lock1]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cat <<'EOF' > comment-body.md
          This thread is being locked.

          Please use the [Discussions Feature](https://github.com/RefindPlusRepo/RefindPlus/discussions?discussions_q=sort%3Adate_created) for follow-on discussion or raise a new issue if appropriate.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

  issue_thread_lock3:
    name: Issue - Thread - Lock3
    needs: [issue_thread_lock2]
    runs-on: ubuntu-latest

    if: ${{ success() || failure() }}
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

  issue_thread_unlock:
    name: Issue - Thread - Unlock
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Issue - Thread - Unlock'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue unlock "$ISSUE_NUMBER"

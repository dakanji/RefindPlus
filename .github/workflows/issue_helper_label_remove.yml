name: 'Issue Helper Label Remove'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Issue Action'
        type: choice
        options:
        - 'Label - Remove - Abandoned'
        - 'Label - Remove - Cancelled'
        - 'Label - Remove - Cannot-Replicate'
        - 'Label - Remove - Declined'
        - 'Label - Remove - Duplicate'
        - 'Label - Remove - Incomplete'
        - 'Label - Remove - Invalid'
        - 'Label - Remove - Triage'
        - 'Label - Remove - NoLog'
        - 'Label - Remove - Parked'
        - 'Label - Remove - Prorogued'
        - 'Label - Remove - Resolved'
        - 'Label - Remove - Tagged'
        - 'Label - Remove - Queries'
        - 'Label - Remove - Upstream'
        - 'Label - Remove - Not-Planned'
        default: 'Label - Remove - Invalid'
      item_id:
        description: 'Item ID'
        type: string
        required: true

permissions:
  issues: write

concurrency:
  group: lock

jobs:

  # ── Remove: Abandoned ─────────────────────────────────────────────
  label_remove_abandoned:
    name: Label - Remove - Abandoned
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Label - Remove - Abandoned'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Remove Abandoned label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Abandoned'

  # ── Remove: Cancelled ─────────────────────────────────────────────

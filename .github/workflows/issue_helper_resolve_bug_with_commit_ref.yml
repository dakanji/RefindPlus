name: 'Issue Helper Resolve Bug (With Commit Ref)'

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Item ID'
        type: string
        required: true
      commit_ref:
        description: 'Commit Ref'
        type: string
        required: true
      show_build_msg:
        description: 'Version Comment'
        type: choice
        options:
        - 'Yes'
        - 'No'
      more_info:
        description: 'More Info'
        type: string
      show_more_info:
        description: 'Show More Info Entry'
        type: choice
        options:
        - 'No'
        - 'Yes'
      type_more_info:
        description: 'More Info Type'
        type: choice
        options:
        - 'Note'
        - 'Caution'

permissions:
  issues: write

concurrency:
  group: lock

jobs:

  issue_resolve_bug:
    name: Issue - Resolve - Bug
    runs-on: ubuntu-latest

    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
      COMMIT_REF: ${{ github.event.inputs.commit_ref }}
      MORE_INFO: ${{ github.event.inputs.more_info }}

    steps:
      # Generate App Token - https://github.com/actions/create-github-app-token
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Check if the issue is already closed
      - id: issue-get-state
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumber = context.payload.inputs.item_id;
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const isClosed = data.state === 'closed' ? 'true' : 'false';

            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_ENV, `isclosed=${isClosed}\n`);

      # Get latest release tag (only if show_build_msg is Yes)
      - if: ${{ github.event.inputs.show_build_msg == 'Yes' }}
        id: part_2_1a
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.app-token.outputs.token }}
          releases-only: true

      # ── Comments ──────────────────────────────────────────────────
      - name: Create comment (build_msg=Yes, note)
        if: |
          github.event.inputs.show_build_msg == 'Yes' &&
          github.event.inputs.show_more_info == 'Yes' &&
          github.event.inputs.type_more_info == 'Note'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.part_2_1a.outputs.tag }}
        run: |
          {
            echo "This item was addressed by Commit ${COMMIT_REF} towards the next RefindPlus release."
            echo "The current release version is **${TAG}**."
            echo "See [BUILDING.md](https://github.com/RefindPlusRepo/RefindPlus/blob/GOPFix/BUILDING.md) for how to access functionality ahead of releases."
            echo ""
            echo "> [!NOTE]"
            echo "> ${MORE_INFO}"
            echo ""
            echo "Thank you for taking the time to report a problem with RefindPlus."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (build_msg=Yes, caution)
        if: |
          github.event.inputs.show_build_msg == 'Yes' &&
          github.event.inputs.show_more_info == 'Yes' &&
          github.event.inputs.type_more_info == 'Caution'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.part_2_1a.outputs.tag }}
        run: |
          {
            echo "This item was addressed by Commit ${COMMIT_REF} towards the next RefindPlus release."
            echo "The current release version is **${TAG}**."
            echo "See [BUILDING.md](https://github.com/RefindPlusRepo/RefindPlus/blob/GOPFix/BUILDING.md) for how to access functionality ahead of releases."
            echo ""
            echo "> [!CAUTION]"
            echo "> ${MORE_INFO}"
            echo ""
            echo "Thank you for taking the time to report a problem with RefindPlus."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (build_msg=Yes, no more_info)
        if: |
          github.event.inputs.show_build_msg == 'Yes' &&
          github.event.inputs.show_more_info == 'No'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.part_2_1a.outputs.tag }}
        run: |
          {
            echo "This item was addressed by Commit ${COMMIT_REF} towards the next RefindPlus release."
            echo "The current release version is **${TAG}**."
            echo "See [BUILDING.md](https://github.com/RefindPlusRepo/RefindPlus/blob/GOPFix/BUILDING.md) for how to access functionality ahead of releases."
            echo ""
            echo "Thank you for taking the time to report a problem with RefindPlus."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (build_msg=No, note)
        if: |
          github.event.inputs.show_build_msg == 'No' &&
          github.event.inputs.show_more_info == 'Yes' &&
          github.event.inputs.type_more_info == 'Note'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          {
            echo "This item was addressed by Commit ${COMMIT_REF} towards the next RefindPlus release."
            echo ""
            echo "> [!NOTE]"
            echo "> ${MORE_INFO}"
            echo ""
            echo "Thank you for taking the time to report a problem with RefindPlus."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (build_msg=No, caution)
        if: |
          github.event.inputs.show_build_msg == 'No' &&
          github.event.inputs.show_more_info == 'Yes' &&
          github.event.inputs.type_more_info == 'Caution'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          {
            echo "This item was addressed by Commit ${COMMIT_REF} towards the next RefindPlus release."
            echo ""
            echo "> [!CAUTION]"
            echo "> ${MORE_INFO}"
            echo ""
            echo "Thank you for taking the time to report a problem with RefindPlus."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (build_msg=No, no more_info)
        if: |
          github.event.inputs.show_build_msg == 'No' &&
          github.event.inputs.show_more_info == 'No'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          {
            echo "This item was addressed by Commit ${COMMIT_REF} towards the next RefindPlus release."
            echo ""
            echo "Thank you for taking the time to report a problem with RefindPlus."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      # ── Label Management ──────────────────────────────────────────
      - name: Add Bug and Resolved labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Bug,Resolved'

      - name: Remove obsolete labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,Noted,No-Log,Tagged,Stale,Queries,Parked,Prorogued,Unclear,Uncertain,Unresolved,Confirmed,Known-Issue,Invalid,Incomplete,Cannot-Replicate'

      # ── Close Issue (if open) ─────────────────────────────────────
      - name: Close issue (if not already closed)
        if: env.isclosed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

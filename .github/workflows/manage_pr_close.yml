name: Manage PR Close

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: manage-pr-close-${{ github.event.pull_request.number }}

jobs:
  handle-labels:
    runs-on: ubuntu-latest

    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Accepted: PR Merged
      - if: github.event.pull_request.merged == true
        id: add-labels-accepted
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'add-labels'
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          labels: 'Accepted'

      # Declined: Maintainer/Bot Closed Contributor PR
      - if: >-
          !github.event.pull_request.merged &&
          github.event.pull_request.user.login != github.actor &&
          (github.actor == 'refindplusrepo[bot]' || github.actor == 'dakanji')
        id: add-labels-declined
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'add-labels'
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          labels: 'Declined'

      # Withdrawn: PR Author Closed PR Themselves
      - if: >-
          !github.event.pull_request.merged &&
          github.event.pull_request.user.login == github.actor
        id: add-labels-withdrawn
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'add-labels'
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          labels: 'Withdrawn'

      - id: remove-labels
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'remove-labels'
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          labels: 'Triage,Queries,Pending,Prorogued'

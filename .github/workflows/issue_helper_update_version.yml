name: 'Issue Helper Outdated Version'

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Item ID'
        type: string
        required: true
      more_info:
        description: 'More Info'
        type: string
      show_more_info:
        description: 'Show More Info Entry'
        type: choice
        options:
        - 'No'
        - 'Yes'
      type_more_info:
        description: 'More Info Type'
        type: choice
        options:
        - 'Note'
        - 'Caution'

permissions:
  issues: write

concurrency:
  group: lock

jobs:
  issue_outdated_version1:
    name: Issue - Outdated - Version1
    runs-on: ubuntu-latest

    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
      MORE_INFO: ${{ github.event.inputs.more_info }}

    steps:
      # Generate App Token
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Get latest release tag
      - id: part_2_1a
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.app-token.outputs.token }}
          releases-only: true

      # ── Comment Variants ──────────────────────────────────────────
      - name: Create comment (more_info=Yes, note)
        if: |
          github.event.inputs.show_more_info == 'Yes' &&
          github.event.inputs.type_more_info == 'Note'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.part_2_1a.outputs.tag }}
        run: |
          {
            echo 'You appear to be running an outdated and/or unsupported version of RefindPlus.'
            echo 'Run the current release version, or an unmodified build as appropriate, and update this thread accordingly.'
            echo ""
            echo "The current release version is **${TAG}**."
            echo 'You can get a copy of the current release version [HERE](https://github.com/RefindPlusRepo/RefindPlus/releases).'
            echo ""
            echo 'Refer to [BUILDING.md](https://github.com/RefindPlusRepo/RefindPlus/blob/GOPFix/BUILDING.md) for how to build RefindPlus.'
            echo 'NB: Use the `Remote GitHub Build Option` to obtain a verifiably unmodified build'
            echo ""
            echo "> [!NOTE]"
            echo "> ${MORE_INFO}"
            echo ""
            echo "> [!IMPORTANT]"
            echo "> Please add debug logging from the new run to the thread update if the issue remains."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (more_info=Yes, caution)
        if: |
          github.event.inputs.show_more_info == 'Yes' &&
          github.event.inputs.type_more_info == 'Caution'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.part_2_1a.outputs.tag }}
        run: |
          {
            echo 'You appear to be running an outdated and/or unsupported version of RefindPlus.'
            echo 'Run the current release version, or an unmodified build as appropriate, and update this thread accordingly.'
            echo ""
            echo "The current release version is **${TAG}**."
            echo 'You can get a copy of the current release version [HERE](https://github.com/RefindPlusRepo/RefindPlus/releases).'
            echo ""
            echo 'Refer to [BUILDING.md](https://github.com/RefindPlusRepo/RefindPlus/blob/GOPFix/BUILDING.md) for how to build RefindPlus.'
            echo 'NB: Use the `Remote GitHub Build Option` to obtain a verifiably unmodified build'
            echo ""
            echo "> [!CAUTION]"
            echo "> ${MORE_INFO}"
            echo ""
            echo "> [!IMPORTANT]"
            echo "> Please add debug logging from the new run to the thread update if the issue remains."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      - name: Create comment (more_info=No)
        if: ${{ github.event.inputs.show_more_info == 'No' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.part_2_1a.outputs.tag }}
        run: |
          {
            echo 'You appear to be running an outdated and/or unsupported version of RefindPlus.'
            echo 'Run the current release version, or an unmodified build as appropriate, and update this thread accordingly.'
            echo ""
            echo "The current release version is **${TAG}**."
            echo 'You can get a copy of the current release version [HERE](https://github.com/RefindPlusRepo/RefindPlus/releases).'
            echo ""
            echo 'Refer to [BUILDING.md](https://github.com/RefindPlusRepo/RefindPlus/blob/GOPFix/BUILDING.md) for how to build RefindPlus.'
            echo 'NB: Use the `Remote GitHub Build Option` to obtain a verifiably unmodified build'
            echo ""
            echo "> [!IMPORTANT]"
            echo "> Please add debug logging from the new run to the thread update if the issue remains."
          } > /tmp/comment-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md

      # ── Label Management ──────────────────────────────────────────
      - name: Add Queries label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Queries'

      - name: Remove unwanted labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,Noted,No-Log,Queries,Parked,Prorogued,Unclear,Uncertain,Unresolved,Confirmed,Bug'

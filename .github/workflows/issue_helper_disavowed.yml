name: 'Issue Helper Disavowed Build'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Issue Action'
        type: choice
        options:
        - 'Drop - Apparent - Bot'
        - 'Drop - Upstream - File'
        - 'Drop - Custom - Build'
        default: 'Drop - Custom - Build'
      item_id:
        description: 'Item ID'
        type: string
        required: true

permissions:
  issues: write

concurrency:
  group: lock

jobs:
  drop_apparent_bot:
    name: Drop - Apparent - Bot
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Drop - Apparent - Bot'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      # Generate App Token - https://github.com/actions/create-github-app-token
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: part_02
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cat <<'EOF' > comment-body.md
          This item appears to largely be LLM Bot data.
          This item cannot be entertained at this time.

          Thank you.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - id: part_03
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'ChatBot,Dropped'

      - id: part_04
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Incomplete,Tagged,Stale,Queries,Enhancement'

      - id: part_05
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

      - id: part_06
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

      # Set NodeJS Up - https://github.com/actions/setup-node
      - id: part_07
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: part_08
        env:
          ENV_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_REPO: ${{ github.repository }}
          ENV_ISSUE_ID: ${{ github.event.inputs.item_id }}
        shell: bash
        run: |
          # Set Title
          NewTitle="Apparent LLM Output: DROPPED"
          echo "Updating issue #${ENV_ISSUE_ID} with title: ${NewTitle}"
          curl -f -X PATCH \
            -H "Authorization: token ${ENV_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${ENV_REPO}/issues/${ENV_ISSUE_ID} \
            -d "{\"title\": \"${NewTitle}\"}" || { echo "Title Update Failed"; exit 1; }



  drop_upstream_file:
    name: Drop - Upstream - File
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Drop - Upstream - File'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      # Generate App Token - https://github.com/actions/create-github-app-token
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: part_02
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cat <<'EOF' > comment-body.md
          You appear to be running an upstream based instance.
          `RefindPlus` was forked from upstream but is not `rEFind`.

          > [!IMPORTANT]
          > Only items related to RefindPlus can be considered here.

          Thank you.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - id: part_03
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Dropped,Upstream'

      - id: part_04
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Incomplete,Tagged,Stale,Queries,Enhancement'

      - id: part_05
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

      - id: part_06
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

      # Set NodeJS Up - https://github.com/actions/setup-node
      - id: part_07
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: part_08
        env:
          ENV_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_REPO: ${{ github.repository }}
          ENV_ISSUE_ID: ${{ github.event.inputs.item_id }}
        shell: bash
        run: |
          # Set Title
          NewTitle="Upstream Issue: DROPPED"
          echo "Updating issue #${ENV_ISSUE_ID} with title: ${NewTitle}"
          curl -f -X PATCH \
            -H "Authorization: token ${ENV_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${ENV_REPO}/issues/${ENV_ISSUE_ID} \
            -d "{\"title\": \"${NewTitle}\"}" || { echo "Title Update Failed"; exit 1; }



  drop_custom_build:
    name: Drop - Custom - Build
    runs-on: ubuntu-latest

    if: github.event.inputs.operation == 'Drop - Custom - Build'
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.inputs.item_id }}
    steps:
      # Generate App Token - https://github.com/actions/create-github-app-token
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: part_02
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cat <<'EOF' > comment-body.md
          You appear to be running a custom build.
          This cannot be entertained at this time.

          > [!IMPORTANT]
          > Issues found on modified/customised builds must be tested on official files/code.
          > Should they also appear on these sources, raise issues based on official files/code.
          > Additionally, debug logs and other similar outputs should be from official files/code.

          Thank you.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment-body.md

      - id: part_03
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label 'Dropped'

      - id: part_04
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label 'Triage,No-Log,Incomplete,Tagged,Stale,Queries'

      - id: part_05
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue close "$ISSUE_NUMBER" --reason "completed"

      - id: part_06
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue lock "$ISSUE_NUMBER"

      # Set NodeJS Up - https://github.com/actions/setup-node
      - id: part_07
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: part_08
        env:
          ENV_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_REPO: ${{ github.repository }}
          ENV_ISSUE_ID: ${{ github.event.inputs.item_id }}
        shell: bash
        run: |
          # Set Title
          NewTitle="RefindPlus of Unknown Provenance: DROPPED"
          echo "Updating issue #${ENV_ISSUE_ID} with title: ${NewTitle}"
          curl -f -X PATCH \
            -H "Authorization: token ${ENV_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${ENV_REPO}/issues/${ENV_ISSUE_ID} \
            -d "{\"title\": \"${NewTitle}\"}" || { echo "Title Update Failed"; exit 1; }
